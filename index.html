<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo-wahyu-beef.png" />
    <link rel="apple-touch-icon" href="/assets/logo-wahyu-beef.png" />
    <title>Member Wahyu Beef</title>
    <style>
      #wb-fallback { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7ecd3; color: #2d2118; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #wb-fallback .box { width: min(100%, 430px); border-radius: 28px; background: #fff8e8; border: 1px solid #ead7ae; box-shadow: 0 20px 60px rgba(105,34,28,.14); padding: 28px; text-align: center; }
      #wb-fallback img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 12px; }
      #wb-fallback h1 { margin: 0 0 8px; color: #8f121b; font-size: 24px; }
      #wb-fallback p { margin: 0 0 16px; line-height: 1.5; color: #6f5840; }
      #wb-fallback button { border: 0; border-radius: 999px; padding: 12px 18px; background: #8f121b; color: #fff8e8; font-weight: 800; }
      body.app-ready #wb-fallback { display: none; }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var el = document.getElementById('wb-fallback-message');
        if (el) el.textContent = 'Aplikasi gagal dimuat di browser ini. Tekan Muat Ulang, atau hapus cache Safari untuk member.wahyubeef.id.';
      });
      window.addEventListener('unhandledrejection', function () {
        var el = document.getElementById('wb-fallback-message');
        if (el) el.textContent = 'Data aplikasi gagal dimuat. Tekan Muat Ulang untuk mencoba lagi.';
      });
      setInterval(function () {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) document.body.classList.add('app-ready');
      }, 300);
    </script>
  </head>
  <body>
    <div id="wb-fallback"><div class="box"><img src="/assets/logo-wahyu-beef.png" alt="Wahyu Beef" /><h1>Membership App</h1><p id="wb-fallback-message">Aplikasi sedang dimuat. Jika layar tetap kosong, tekan tombol di bawah.</p><button type="button" onclick="location.reload()">Muat Ulang</button></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
